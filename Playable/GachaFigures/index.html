        <style>html[data-gacha-loading]{--loading-width:min(100vw, calc(100vh * 16 / 9));--loading-height:min(100vh, calc(100vw * 9 / 16));--loading-width-factor:.396;--loading-label-offset:.321;--loading-meter-offset:.091;--loading-meter-height:.022;--loading-art:url(assets/ui/gacha/loading-landscape.webp);background:#211029}@media (aspect-ratio<1){html[data-gacha-loading]{--loading-width:min(100vw, calc(100vh * 9 / 16));--loading-height:min(100vh, calc(100vw * 16 / 9));--loading-width-factor:.696;--loading-label-offset:.302;--loading-meter-offset:.073;--loading-meter-height:.021;--loading-art:url(assets/ui/gacha/loading-portrait.webp)}}html[data-gacha-loading] body{background:0 0}html[data-gacha-loading] #application-canvas{opacity:0;pointer-events:none}html[data-gacha-loading]:before,html[data-gacha-loading]:after{z-index:100;pointer-events:none;position:fixed;left:50%}html[data-gacha-loading]:before{content:"";width:var(--loading-width);height:var(--loading-height);background:var(--loading-art) center / contain no-repeat;image-rendering:pixelated;top:50%;transform:translate(-50%,-50%)}html[data-gacha-loading]:after{content:var(--gacha-loading-label,"Loading toys…");top:calc(50% + var(--loading-height) * var(--loading-label-offset));width:calc(var(--loading-width) * var(--loading-width-factor));height:calc(var(--loading-height) * var(--loading-meter-offset));color:#fff0bd;font:700 clamp(11px, calc(var(--loading-height) * .026), 34px) / 1.15 "Gacha Pixelify Sans", "Gacha Store Pixel", "Gacha Rare Pixel", monospace;text-align:center;text-shadow:0 2px #240d27;background:linear-gradient(#fff6aa 0 26%, #ffc249 27% 76%, #e28a31 77%) left bottom / var(--gacha-load-progress,0%) calc(var(--loading-height) * var(--loading-meter-height)) no-repeat, repeating-linear-gradient(115deg, #321035 0 9px, #47204c 9px 18px) left bottom / calc(100% + 24px) calc(var(--loading-height) * var(--loading-meter-height)) no-repeat;border-radius:3px;animation:.85s linear infinite gacha-loading
