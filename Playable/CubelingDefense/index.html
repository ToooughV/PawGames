<!doctype html>
<html lang="en" class="cube-game">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cubeling Defense</title>
        <!-- Discover small first-scene dependencies while the engine bundle downloads. -->
        <link rel="preload" href="./config/cube-levels.json" as="fetch" crossorigin />
        <link rel="preload" href="./assets/ui/atlas/icons-0-cff2f4d15ea5.webp" as="fetch" crossorigin />
        <!-- Vite 按发行模式在 head 中写入对应官方 SDK，早于游戏入口；普通/standalone 构建不引入平台 SDK。 -->
      <script type="module" crossorigin src="./assets/index-BGgYH6Wf.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-BHH3AdJw.css">
    </head>
    <body>
        <canvas id="application-canvas"></canvas>
        <section id="cube-loading" aria-label="Cubeling Defense">
            <img
                class="loading-logo"
                src="./art/loading-logo-v5.webp"
                alt="Cubeling Defense"
                width="840"
                height="308"
                draggable="false"
            />
            <div class="loading-stage">
                <i class="loading-island small" aria-hidden="true"></i
                ><img
                    class="loading-scene"
                    fetchpriority="low"
                    decoding="async"
                    src="./art/loading-scene-v5.webp"
                    alt=""
                    width="1119"
                    height="700"
                    draggable="false"
                /><img class="loading-tower" src="./art/loading-tower-v5.webp" alt="" draggable="false" /><button
                    class="loading-target"
                    type="button"
                    aria-label="Tap the cubeling!"
                >
                    <img class="loading-enemy" src="./art/cube-icon-v2.webp" alt="" draggable="false" /></button
                ><i class="loading-arrow" aria-hidden="true"></i><span class="loading-spark" aria-hidden="true">✦</span>
            </div>
            <div class="loading-play">
                <span class="loading-invite">Tap the cubeling!</span
                ><output class="loading-score" aria-live="polite"><span>HITS</span> <b>0</b></output>
            </div>
            <div class="loading-status" role="status">
                <strong>Loading resources…</strong><progress aria-label="Loading resources…"></progress
                ><small>Place towers at corners to cover more of the path.</small>
            </div>
        </section>
        <script src="./loading-play.js" defer></script>
    </body>
</html>
